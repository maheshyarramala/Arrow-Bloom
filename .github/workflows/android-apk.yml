name: Android APK

on:
  push:
    branches: [main, 'performance/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Verify gameplay rules and key levels
        run: npm run test:levels

      - name: Verify progress backup and recovery
        run: npm run test:storage

      - name: Build web game
        run: npm run build

      - name: Create Android project when missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Apply Arrow Bloom app icon and branding
        run: npm run android:icons

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare named APK for release
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "Found generated APK at: $APK_FILE"
          cp "$APK_FILE" dist-apk/Arrow-Bloom.apk
          ls -lh dist-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Bloom-APK
          path: dist-apk/Arrow-Bloom.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Arrow Bloom Android Build ${{ github.run_number }}
          body: |
            Automated Android APK for Arrow Bloom.

            Features:
            - Custom Arrow Bloom (🌸) icon & splash branding
            - 300 handcrafted arrow puzzle maze levels
            - Daily Missions, Streaks & Rewards
            - ₹99 Lifetime Ad-Free VIP Pass
            - Google Play Games achievements & leaderboard
          files: dist-apk/Arrow-Bloom.apk
          make_latest: true
