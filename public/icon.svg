<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E1B4B" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Glowing Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FF2A85" />
      <stop offset="35%" stopColor="#FF7A00" />
      <stop offset="70%" stopColor="#FFD000" />
      <stop offset="100%" stopColor="#00E5FF" />
    </linearGradient>

    <!-- Petal Bloom Gradient -->
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF2A85" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#7928CA" stopOpacity="0.2" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00E5FF" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#2563EB" stopOpacity="0.2" />
    </linearGradient>
    <linearGradient id="petalGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFD000" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#EA580C" stopOpacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF2A85" stopOpacity="0.6" />
      <stop offset="50%" stopColor="#00E5FF" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#FFD000" stopOpacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Rim Glow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Subtle Concentric Silhouette Grid Dots -->
  <g fill="#FFFFFF" opacity="0.12">
    <circle cx="160" cy="160" r="6" />
    <circle cx="256" cy="160" r="6" />
    <circle cx="352" cy="160" r="6" />
    <circle cx="160" cy="256" r="6" />
    <circle cx="256" cy="256" r="6" />
    <circle cx="352" cy="256" r="6" />
    <circle cx="160" cy="352" r="6" />
    <circle cx="256" cy="352" r="6" />
    <circle cx="352" cy="352" r="6" />
  </g>

  <!-- Bloom Floral Petals radiating behind the Arrow -->
  <g transform="translate(256, 260)" opacity="0.8">
    <!-- Petal 1 Top Right -->
    <path d="M 0 0 C 40 -80 120 -100 130 -30 C 140 40 60 50 0 0 Z" fill="url(#petalGrad1)" />
    <!-- Petal 2 Top Left -->
    <path d="M 0 0 C -40 -80 -120 -100 -130 -30 C -140 40 -60 50 0 0 Z" fill="url(#petalGrad2)" />
    <!-- Petal 3 Bottom Left -->
    <path d="M 0 0 C -80 40 -110 120 -40 130 C 30 140 40 60 0 0 Z" fill="url(#petalGrad3)" />
    <!-- Petal 4 Bottom Right -->
    <path d="M 0 0 C 80 40 110 120 40 130 C -30 140 -40 60 0 0 Z" fill="url(#petalGrad1)" />
  </g>

  <!-- Main Neon Blooming Arrow (Winding 90-degree maze snake bursting into an arrow head) -->
  <g filter="url(#neonGlow)">
    <!-- Arrow Tail: Starts at lower-left, goes up, right, up, and shoots outward -->
    <path
      d="M 128 356 L 128 220 C 128 190 150 168 180 168 L 290 168 C 320 168 344 190 344 220 L 344 140"
      fill="none"
      stroke="url(#arrowGrad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Interlocking Companion Mini Arrow (showing maze depth) -->
    <path
      d="M 200 356 L 270 356 C 290 356 306 340 306 320 L 306 280"
      fill="none"
      stroke="#FF2A85"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />
    <!-- Mini Arrow Head -->
    <polygon points="306,260 286,290 326,290" fill="#FF2A85" />

    <!-- Big Majestic Arrow Head pointing Upward/Escaping -->
    <polygon
      points="344,88 280,172 408,172"
      fill="url(#arrowGrad)"
      stroke="#FFFFFF"
      stroke-width="4"
    />

    <!-- Center Light Burst Core -->
    <circle cx="344" cy="144" r="14" fill="#FFFFFF" />
  </g>

  <!-- Sparkles -->
  <g fill="#FFF" opacity="0.95">
    <!-- Big Sparkle Top Left -->
    <path d="M 120 110 Q 120 130 100 130 Q 120 130 120 150 Q 120 130 140 130 Q 120 130 120 110 Z" />
    <!-- Medium Sparkle Right -->
    <path d="M 400 240 Q 400 252 388 252 Q 400 252 400 264 Q 400 252 412 252 Q 400 252 400 240 Z" />
    <!-- Small Sparkle Bottom -->
    <circle cx="210" cy="400" r="5" />
    <circle cx="380" cy="380" r="4" />
  </g>
</svg>
